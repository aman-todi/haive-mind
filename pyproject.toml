[project]
name = "haive-mind"
version = "0.1.0"
description = "Local-first CLI that answers questions about, and helps debug, your own git repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "tomli-w>=1.0",
    "platformdirs>=4",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "fastembed>=0.4",
    "pinecone>=5",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.6",
    "ddgs>=9",
]

[project.optional-dependencies]
chroma = ["chromadb>=0.5"]
tavily = ["langchain-tavily>=0.1"]

[project.scripts]
haive = "haive.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "chromadb>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haive"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.pycodestyle]
max-line-length = 125  # formatter wraps at 110; hand-aligned tables (fmt: skip) may run a bit longer
