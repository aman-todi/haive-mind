# ---------------------------------------------------------------- debug
# Hand-written traces against the current code (real paths and line numbers as the Docker images
# lay them out), for failures caused by configuration or input rather than a code change, so the
# repos stay untouched. expected_line is where the error is raised.
- id: debug-iv-wacc-spread
  question: Why did this valuation build fail?
  repos: [intrinsic-valuation]
  trace_file: eval/traces/iv-wacc-spread.txt
  expected_intent: debug
  expected_files: [intrinsic-valuation/backend/app/valuation/fcff.py]
  expected_line: 152
  notes: the worker's FCFF run rejects a WACC within 0.5 pp of terminal growth; the fix is in the inputs
- id: debug-wp-readonly-pool
  question: Why does the query_closet_items tool fail?
  repos: [weatherpruf]
  trace_file: eval/traces/wp-readonly-pool.txt
  expected_intent: debug
  expected_files: [weatherpruf/backend/app/db.py]
  expected_line: 87
  notes: READONLY_DATABASE_URL isn't set, so connect() skipped the read-only pool (db.py:61)

