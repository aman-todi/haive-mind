# Eval suite for YOUR registered repos (drafted by Claude Code from them; see the README).
# About 30 questions, 4-5 per intent. Fields:
#   id, question, repos (optional scope), expected_intent, expected_files (repo/path that must
#   appear among verified repo refs), notes. Debug cases add trace_file and expected_line and
#   come from bug injection (eval/inject_bugs.py) on temp copies, never your repos.
#
# Example:
# - id: lookup-dcf-method
#   question: Where does the DCF choose a valuation method?
#   repos: [valuation-backend]
#   expected_intent: lookup
#   expected_files: [valuation-backend/app/valuation/dcf.py]

# Draft by Claude Code (Oct 2026). Expected files come from citations that passed verification in
# real runs. haive-mind itself is not indexed (`haive add --scan` skips it), so no questions are
# about it. Add questions for your other repos (auditbuddy, earnings-call-analysis, ...).
# History questions cite commits (no file), so they leave expected_files empty and score intent only.

